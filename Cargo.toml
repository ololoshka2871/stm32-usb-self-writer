[package]
authors = ["ololoshka2871"]
edition = "2024"
readme = "README.md"
name = "stm32-usb-self-writer"
version = "0.6.0"
resolver = "2"

[dependencies]
num = { version = "0.4", default-features = false, features = ["alloc"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
static_assertions = "1.1.0"
vcell = "0.1.3"
bitflags = "1.3.2"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
no-std-async = "1.1"
async-trait = "0.1.80"
lazy_static = { version = "1.5", default-features = false, features = ["spin_no_std"] }
umm-malloc = { version = "0.3.2", features = ["cortex-m-interrupt-critical-section"] }

embedded-hal = { version = "0.2.7", features = ["unproven"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7"

serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

strum = { version = "0.27", default-features = false, features = ["derive"] }

usb-device = "0.2.7"
stm32-usbd = "0.6.0"
usbd-serial = { git = "https://github.com/ololoshka2871/usbd-serial.git", rev = "538d902" }
usbd_scsi = { git = "https://github.com/ololoshka2871/stm32-usb.rs.git", rev = "9f80627", features = ["no-zlp", "direct-read-hack"] }
usbd_mass_storage = { git = "https://github.com/ololoshka2871/stm32-usb.rs.git", rev = "9f80627" }

rtic = { version = "2.1", features = ["rtic-monotonics"] }
rtic-sync = { version = "=1.3.1-alpha.1" }
rtic-monotonics = { version = "2.0", features = ["cortex-m-systick"] }

# defmt
defmt = "1"
defmt-rtt = "1"
defmt-macros = "1"
panic-abort = "0.3"

stm32ral = { version = "0.8", default-features = false, features = ["rtic"] }
stm32l4xx-hal = { version = "0.7.1", features = ["rt", "unproven", "stm32-usbd"] }
stm32-device-signature = "0.3.3"

self-recorder-packet = { git = "https://gitea.sctbelpa/SCTBElpa/self-recorder-packet.git", rev = "8408b66a792611e8c96b0a5156d444ce0e6e7fb4", default-features = false }

heatshrink-rust = { git = "https://github.com/ololoshka2871/heatshrink.rs.git", rev = "0af9332" }
heatshrink-rust-macro = { git = "https://github.com/ololoshka2871/heatshrink.rs.git", rev = "0af9332" }
emfat-rust = { path = "lib/emfat" }
flash-settings-rs = { path = "lib/flash-settings.rs" }
my-proc-macro = { path = "lib/my-proc-macro" }
qspi-stm32lx3 = { path = "lib/qspi_stm32l4x3" }

prost = { version = "0.13", default-features = false, features = ["derive"] }

# special
# Непрямые зависимости со специальными фичами

[build-dependencies]
prost-build = "0.13"

[profile.dev.package."*"]
opt-level = "z"

[profile.release]
opt-level = "z"
codegen-units = 1 # better optimizations
debug = true # добавлять отладочные символы. Не влияет на размер исполняемого кода, зато работает дебаг
panic = 'abort'
lto = true

[features]
default = [
  "stm32l433",
  "freqmeter-start-stop", # При временах измерения <= 100 мс только этот режим адекватно работает
  "led-blink",
  "led-blink-each-block",
  "flash-sleep",

  #"no-flash",
]

stm32l433 = [
  "stm32l4xx-hal/stm32l433", 
  "qspi-stm32lx3/stm32l433", 
  "rtic/thumbv7-backend",
  "stm32ral/armv7em", "stm32ral/stm32l4x3",
  "stm32-device-signature/stm32l4",
]
monitor = []
freqmeter-start-stop = []
led-blink = []
led-blink-each-block = ["led-blink"]
flash-sleep = []

no-flash = [] # only for debug 
force-defmt-logs = [] # early enable defmt logs via enable dma controller
maket = [] # QSPI_BK1 -> PE12

# select xtal frequency via features
xtal-24mhz = []
xtal-12mhz = []